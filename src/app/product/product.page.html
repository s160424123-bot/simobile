<ion-header [translucent]="true">
  <ion-toolbar>
       <ion-buttons slot="start">
  <ion-back-button defaultHref="/pengaturan"></ion-back-button>
</ion-buttons>

    <ion-title>Product</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">product</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-searchbar placeholder="Cari Produk..." [(ngModel)]="searchTerm" (ionInput)="filterProducts()"></ion-searchbar>
  <ion-list>
    <ion-item *ngFor="let product of filterProduk">
      <ion-label>{{ product.name }} <br><p>Harga: Rp.{{ product.price }}</p></ion-label>
    </ion-item>
  </ion-list>
</ion-content>
