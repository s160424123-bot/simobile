<ion-app>
  <ion-menu auto-hide="true" contentId="main-content">

    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>Menu List</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">
      <ion-list>

        <ion-menu-toggle>
          <ion-item routerLink="/pengaturan">
            <ion-icon name="settings-outline" slot="start"></ion-icon>
            <ion-label>Pengaturan</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle>
          <ion-item routerLink="/tentangaplikasi">
            <ion-icon name="information-outline" slot="start"></ion-icon>
            <ion-label>Tentang Aplikasi</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle>
          <ion-item routerLink="/logout">
            <ion-icon name="log-out-outline" slot="start"></ion-icon>
            <ion-label>Logout</ion-label>
          </ion-item>
        </ion-menu-toggle>

      </ion-list>
    </ion-content>

  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>

  <ion-tabs>

    <ion-tab-bar slot="bottom">

      <ion-tab-button tab="dashboard">
        <ion-icon name="grid"></ion-icon>
        <ion-label>Dashboard</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="product">
        <ion-icon name="bag-outline"></ion-icon>
        <ion-label>Produk</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="keranjang">
        <ion-icon name="cart"></ion-icon>
        <ion-label>Keranjang</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="transaksi">
        <ion-icon name="card-outline"></ion-icon>
        <ion-label>Transaksi</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="newproduk">
        <ion-icon name="add"></ion-icon>
        <ion-label>Tambah Produk</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="profil">
        <ion-icon name="person-outline"></ion-icon>
        <ion-label>Profil</ion-label>
      </ion-tab-button>

    </ion-tab-bar>

  </ion-tabs>

</ion-app>
