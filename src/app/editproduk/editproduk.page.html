<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Edit Produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Edit Produk</ion-title>
    </ion-toolbar>
  </ion-header>
<ion-list>
    <ion-item>
      <ion-input
        label="Nama Produk"
        labelPlacement="stacked"
        [(ngModel)]="new_name">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        type="number"
        label="Harga Beli"
        labelPlacement="stacked"
        [(ngModel)]="new_hargaBeli">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        type="number"
        label="Harga Jual"
        labelPlacement="stacked"
        [(ngModel)]="new_hargaJual">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        type="number"
        label="Stok"
        labelPlacement="stacked"
        [(ngModel)]="new_stok">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-button (click)="updateproduk()">
        Simpan Perubahan
      </ion-button>
    </ion-item>

  </ion-list>


</ion-content>
