<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Detail Produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">detailproduk</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <img [src]="products[id].gambar || 'https://placehold.co/300x200?text=No+Image'">
    <ion-card-header>
      <ion-card-title>{{ products[id].name }}</ion-card-title>
      <!-- <ion-card-subtitle>{{product[id].price | number}}</ion-card-subtitle> -->
    </ion-card-header>

    <ion-card-content>
      Stok: {{ products[id].stok }}<br>
      Harga Beli: Rp.{{ products[id].HargaBeli | number }}<br>
      Harga Jual: Rp.{{ products[id].HargaJual | number }}
    </ion-card-content>

    <ion-button [disabled]="products[id].stok === 0" (click)="tambahKeranjang()">
      Tambah ke Keranjang
    </ion-button>
  </ion-card>
</ion-content>
