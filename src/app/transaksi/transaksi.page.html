<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start" >
      <ion-back-button defaultHref="/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Transaksi</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">transaksi</ion-title>
    </ion-toolbar>
  </ion-header>


  <div class="ion-padding">
    <ion-list *ngIf="daftarTransaksi.length > 0; else empty">


      <ion-item *ngFor="let trx of daftarTransaksi" button [routerLink]="['/detail-transaksi', trx.id]">
        <ion-label>
          <h2>ID: {{ trx.id }}</h2>

          <p>{{ trx.date | date:'medium' }}</p>

          <h3>
            Total Harga: Rp {{ trx.totalAmount | number }}
          </h3>
        </ion-label>
      </ion-item>
    </ion-list>

    <ng-template #empty>
      <div class="ion-text-center ion-padding" style="margin-top: 40px;">
        <p>Belum ada riwayat transaksi yang dikonfirmasi.</p>
      </div>
    </ng-template>
  </div>
</ion-content>
